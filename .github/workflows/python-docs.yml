name: Python article examples

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/data/blog/Python/**"
      - "scripts/verify_python_articles.py"
      - "requirements/python-docs.txt"
      - ".github/workflows/python-docs.yml"
  workflow_call:

jobs:
  examples:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate article snippets
        run: python scripts/verify_python_articles.py --run

  quality:
    name: Docs security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/python-docs.txt
      - name: Install audit tools
        run: python -m pip install ruff bandit pip-audit
      - name: Lint documentation tooling
        run: ruff check scripts/verify_python_articles.py scripts/classify_python_snippet_deps.py scripts/modernize_python_p0.py scripts/modernize_python_remaining.py scripts/remove_python_learning_sections.py
      - name: Scan documentation tooling
        run: bandit -q -r scripts
      - name: Audit locked article dependencies
        run: pip-audit -r requirements/python-docs.txt
      - name: Scan snippets, secrets, and images
        run: python scripts/verify_python_articles.py
