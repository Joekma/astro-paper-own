<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">微调模型部署链路</title>
  <desc id="desc">
    展示 adapter、合并、量化、推理服务、网关和监控的部署链路。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #64748b;
        stroke-width: 2;
        rx: 12;
      }
      .deploy {
        fill: #f0fdf4;
        stroke: #22c55e;
        stroke-width: 2;
        rx: 12;
      }
      .title {
        fill: #0f172a;
        font:
          700 24px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #334155;
        font:
          600 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #16a34a;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56">微调模型部署链路</text>
  <rect class="box" x="60" y="120" width="160" height="90" />
  <text class="text" x="96" y="154">产物</text>
  <text class="small" x="86" y="184">base + adapter</text>
  <rect class="box" x="270" y="120" width="160" height="90" />
  <text class="text" x="306" y="154">合并</text>
  <text class="small" x="304" y="184">merge adapter</text>
  <rect class="box" x="480" y="120" width="160" height="90" />
  <text class="text" x="516" y="154">量化</text>
  <text class="small" x="510" y="184">int8 / int4 / AWQ</text>
  <rect class="deploy" x="690" y="120" width="190" height="90" />
  <text class="text" x="740" y="154">推理服务</text>
  <text class="small" x="720" y="184">vLLM / TGI / API Server</text>
  <path class="arrow" d="M220 165 H270" />
  <path class="arrow" d="M430 165 H480" />
  <path class="arrow" d="M640 165 H690" />
  <rect class="box" x="180" y="320" width="210" height="90" />
  <text class="text" x="226" y="354">流量网关</text>
  <text class="small" x="220" y="384">灰度、限流、降级</text>
  <rect class="box" x="500" y="320" width="260" height="90" />
  <text class="text" x="584" y="354">监控回滚</text>
  <text class="small" x="536" y="384">质量、延迟、成本、安全、版本</text>
  <path class="arrow" d="M785 210 C785 282 630 282 630 320" />
  <path class="arrow" d="M500 365 H390" />
</svg>
