<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">SFT 监督微调工作流</title>
  <desc id="desc">
    展示指令数据、聊天模板、SFTTrainer、验证集和模型产物的关系。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #a78bfa;
        stroke-width: 2;
        rx: 12;
      }
      .accent {
        fill: #f5f3ff;
        stroke: #7c3aed;
        stroke-width: 2;
        rx: 12;
      }
      .title {
        fill: #0f172a;
        font:
          700 24px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #334155;
        font:
          600 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #7c3aed;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56">SFT 监督微调工作流</text>
  <rect class="box" x="70" y="120" width="180" height="92" />
  <text class="text" x="112" y="154">指令数据</text>
  <text class="small" x="100" y="184">instruction / output</text>
  <rect class="box" x="310" y="120" width="180" height="92" />
  <text class="text" x="352" y="154">聊天模板</text>
  <text class="small" x="344" y="184">system / user / assistant</text>
  <rect class="accent" x="550" y="120" width="190" height="92" />
  <text class="text" x="590" y="154">SFTTrainer</text>
  <text class="small" x="584" y="184">loss 只学习答案区</text>
  <rect class="box" x="550" y="300" width="190" height="92" />
  <text class="text" x="596" y="334">验证评估</text>
  <text class="small" x="590" y="364">loss / win rate / 人评</text>
  <rect class="box" x="790" y="210" width="130" height="92" />
  <text class="text" x="818" y="244">模型</text>
  <text class="small" x="812" y="274">adapter 或 full</text>
  <path class="arrow" d="M250 166 H310" />
  <path class="arrow" d="M490 166 H550" />
  <path class="arrow" d="M740 166 C790 166 790 210 790 256" />
  <path class="arrow" d="M645 212 V300" />
  <path class="arrow" d="M740 346 C820 346 855 318 855 302" />
</svg>
