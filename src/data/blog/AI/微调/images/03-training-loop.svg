<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">大模型训练循环</title>
  <desc id="desc">
    展示 tokenizer、batch、forward、loss、backward 和 optimizer step
    的训练循环。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #fff7ed;
        stroke: #fb923c;
        stroke-width: 2;
        rx: 12;
      }
      .core {
        fill: #ffffff;
        stroke: #64748b;
        stroke-width: 2;
        rx: 14;
      }
      .title {
        fill: #0f172a;
        font:
          700 24px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #334155;
        font:
          600 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #ea580c;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56">训练循环：从文本到参数更新</text>
  <rect class="box" x="90" y="120" width="170" height="90" />
  <text class="text" x="130" y="154">Tokenizer</text>
  <text class="small" x="124" y="184">文本转 token id</text>
  <rect class="box" x="330" y="120" width="170" height="90" />
  <text class="text" x="374" y="154">Batch</text>
  <text class="small" x="356" y="184">padding / mask / labels</text>
  <rect class="core" x="570" y="120" width="200" height="90" />
  <text class="text" x="612" y="154">Forward</text>
  <text class="small" x="612" y="184">logits 与 hidden states</text>
  <rect class="box" x="570" y="300" width="200" height="90" />
  <text class="text" x="636" y="334">Loss</text>
  <text class="small" x="610" y="364">交叉熵 / mask loss</text>
  <rect class="box" x="330" y="300" width="170" height="90" />
  <text class="text" x="366" y="334">Backward</text>
  <text class="small" x="354" y="364">梯度累积与裁剪</text>
  <rect class="box" x="90" y="300" width="170" height="90" />
  <text class="text" x="116" y="334">Optimizer</text>
  <text class="small" x="120" y="364">更新可训练参数</text>
  <path class="arrow" d="M260 165 H330" />
  <path class="arrow" d="M500 165 H570" />
  <path class="arrow" d="M670 210 V300" />
  <path class="arrow" d="M570 345 H500" />
  <path class="arrow" d="M330 345 H260" />
  <path class="arrow" d="M175 300 C175 250 175 244 175 210" />
</svg>
