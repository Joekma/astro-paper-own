<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">平台 API 微调流程</title>
  <desc id="desc">
    展示本地 JSONL 数据上传到平台，创建微调任务，评估并调用微调模型。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #64748b;
        stroke-width: 2;
        rx: 12;
      }
      .cloud {
        fill: #eef2ff;
        stroke: #4f46e5;
        stroke-width: 2;
        rx: 18;
      }
      .title {
        fill: #0f172a;
        font:
          700 24px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #334155;
        font:
          600 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #4f46e5;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56">平台 API 微调流程</text>
  <rect class="box" x="70" y="130" width="170" height="90" />
  <text class="text" x="118" y="164">JSONL</text>
  <text class="small" x="102" y="194">训练 / 验证数据</text>
  <rect class="cloud" x="310" y="100" width="350" height="260" />
  <text class="text" x="418" y="140">微调平台</text>
  <rect class="box" x="360" y="170" width="250" height="62" />
  <text class="small" x="412" y="208">Files API 上传数据</text>
  <rect class="box" x="360" y="258" width="250" height="62" />
  <text class="small" x="402" y="296">Create fine-tuning job</text>
  <rect class="box" x="730" y="130" width="170" height="90" />
  <text class="text" x="766" y="164">微调模型</text>
  <text class="small" x="762" y="194">线上调用与回归</text>
  <rect class="box" x="382" y="404" width="210" height="70" />
  <text class="text" x="430" y="434">结果评估</text>
  <text class="small" x="412" y="458">任务指标 + 业务样例</text>
  <path class="arrow" d="M240 175 H310" />
  <path class="arrow" d="M660 175 H730" />
  <path class="arrow" d="M485 360 V404" />
</svg>
