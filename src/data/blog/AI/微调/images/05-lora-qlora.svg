<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">LoRA 与 QLoRA 参数高效微调</title>
  <desc id="desc">展示冻结基座模型、低秩适配器和 4-bit 量化基座的关系。</desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .base {
        fill: #e2e8f0;
        stroke: #64748b;
        stroke-width: 2;
        rx: 12;
      }
      .lora {
        fill: #dcfce7;
        stroke: #16a34a;
        stroke-width: 2;
        rx: 10;
      }
      .quant {
        fill: #fef9c3;
        stroke: #ca8a04;
        stroke-width: 2;
        rx: 10;
      }
      .title {
        fill: #0f172a;
        font:
          700 24px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #334155;
        font:
          600 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #16a34a;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56">LoRA / QLoRA：只训练很少的新增参数</text>
  <rect class="base" x="80" y="120" width="250" height="250" />
  <text class="text" x="150" y="168">冻结基座模型</text>
  <text class="small" x="128" y="202">Transformer 原始权重不更新</text>
  <rect class="lora" x="410" y="126" width="170" height="86" />
  <text class="text" x="462" y="158">矩阵 A</text>
  <text class="small" x="448" y="186">低秩下投影</text>
  <rect class="lora" x="410" y="276" width="170" height="86" />
  <text class="text" x="462" y="308">矩阵 B</text>
  <text class="small" x="448" y="336">低秩上投影</text>
  <path class="arrow" d="M330 245 H410" />
  <path class="arrow" d="M495 212 V276" />
  <rect class="quant" x="680" y="120" width="220" height="118" />
  <text class="text" x="750" y="160">QLoRA</text>
  <text class="small" x="714" y="192">4-bit 加载基座 + LoRA 训练</text>
  <rect class="lora" x="680" y="282" width="220" height="88" />
  <text class="text" x="736" y="316">部署选择</text>
  <text class="small" x="716" y="344">保留 adapter 或合并权重</text>
  <path class="arrow" d="M580 169 H680" />
  <path class="arrow" d="M580 319 H680" />
</svg>
