  </text>
  <rect class="box" x="80" y="120" width="210" height="92" rx="12" />
  <text class="text" x="185" y="158" text-anchor="middle">Query</text>
  <text class="small" x="185" y="188" text-anchor="middle">用户问题</text>
  <path class="arrow" d="M290 166 L360 166" />
  <rect class="accent" x="360" y="120" width="210" height="92" rx="12" />
  <text class="text" x="465" y="158" text-anchor="middle">BM25</text>
  <text class="small" x="465" y="188" text-anchor="middle">关键词召回</text>
  <path class="arrow" d="M570 166 L640 166" />
  <rect class="green" x="640" y="120" width="210" height="92" rx="12" />
  <text class="text" x="745" y="158" text-anchor="middle">Vector</text>
  <text class="small" x="745" y="188" text-anchor="middle">语义召回</text>
  <path class="arrow" d="M745 212 C745 250 745 272 745 310" />
  <rect class="yellow" x="640" y="310" width="210" height="92" rx="12" />
  <text class="text" x="745" y="348" text-anchor="middle">Fusion</text>
  <text class="small" x="745" y="378" text-anchor="middle">结果融合</text>
  <path class="arrow" d="M640 356 L570 356" />
  <rect class="purple" x="360" y="310" width="210" height="92" rx="12" />
  <text class="text" x="465" y="348" text-anchor="middle">Reranker</text>
  <text class="small" x="465" y="378" text-anchor="middle">精排</text>
  <path class="arrow" d="M360 356 L290 356" />
  <rect class="rose" x="80" y="310" width="210" height="92" rx="12" />
  <text class="text" x="185" y="348" text-anchor="middle">Context</text>
  <text class="small" x="185" y="378" text-anchor="middle">送入模型</text>
  <rect class="tag" x="89" y="450" width="170" height="38" rx="19" />
  <text class="small" x="174" y="475" text-anchor="middle">Hybrid</text>
  <rect class="tag" x="293" y="450" width="170" height="38" rx="19" />
  <text class="small" x="378" y="475" text-anchor="middle">RRF</text>
  <rect class="tag" x="497" y="450" width="170" height="38" rx="19" />
  <text class="small" x="582" y="475" text-anchor="middle">Cross-Encoder</text>
  <rect class="tag" x="701" y="450" width="170" height="38" rx="19" />
  <text class="small" x="786" y="475" text-anchor="middle">TopK</text>
</svg>
