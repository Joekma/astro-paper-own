<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">RAG 混合检索与重排序</title>
  <desc id="desc">
    展示关键词检索、向量检索、融合排序、重排序和上下文选择。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
