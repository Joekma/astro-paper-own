<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">多 Agent 协作模式</title>
  <desc id="desc">
    展示主 Agent 如何拆解任务、委派子 Agent、并行执行并汇总结果。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 2;
      }
      .accent {
        fill: #dbeafe;
        stroke: #2563eb;
        stroke-width: 2;
      }
      .green {
        fill: #dcfce7;
        stroke: #16a34a;
        stroke-width: 2;
      }
      .yellow {
        fill: #fef9c3;
        stroke: #ca8a04;
        stroke-width: 2;
      }
      .purple {
        fill: #ede9fe;
        stroke: #7c3aed;
        stroke-width: 2;
      }
      .rose {
        fill: #ffe4e6;
        stroke: #e11d48;
        stroke-width: 2;
      }
      .soft {
        fill: #eef2ff;
        stroke: #818cf8;
        stroke-width: 2;
        stroke-dasharray: 8 8;
      }
      .tag {
        fill: #eff6ff;
        stroke: #60a5fa;
        stroke-width: 1.5;
      }
      .title {
        fill: #0f172a;
        font:
          700 26px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .subtitle {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .center {
        fill: #0f172a;
        font:
          700 21px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #1e293b;
        font:
          700 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          500 14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #2563eb;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .grid {
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56" text-anchor="start">多 Agent 协作模式</text>
  <text class="subtitle" x="48" y="84" text-anchor="start">
    展示主 Agent 如何拆解任务、委派子 Agent、并行执行并汇总结果。
  </text>
  <rect class="accent" x="365" y="210" width="230" height="100" rx="18" />
  <text class="center" x="480" y="252" text-anchor="middle">协调者</text>
  <text class="small" x="480" y="284" text-anchor="middle">拆解与汇总</text>
  <path class="arrow" d="M365 228 L260 198" />
  <rect class="accent" x="70" y="128" width="190" height="86" rx="12" />
  <text class="text" x="165" y="166" text-anchor="middle">规划 Agent</text>
  <text class="small" x="165" y="196" text-anchor="middle">拆任务</text>
  <path class="arrow" d="M476 210 L473 176" />
  <rect class="green" x="375" y="90" width="190" height="86" rx="12" />
  <text class="text" x="470" y="128" text-anchor="middle">检索 Agent</text>
  <text class="small" x="470" y="158" text-anchor="middle">找资料</text>
  <path class="arrow" d="M595 225 L680 200" />
  <rect class="yellow" x="680" y="128" width="190" height="86" rx="12" />
  <text class="text" x="775" y="166" text-anchor="middle">编码 Agent</text>
  <text class="small" x="775" y="196" text-anchor="middle">改代码</text>
  <path class="arrow" d="M365 300 L260 336" />
  <rect class="purple" x="70" y="326" width="190" height="86" rx="12" />
  <text class="text" x="165" y="364" text-anchor="middle">评审 Agent</text>
  <text class="small" x="165" y="394" text-anchor="middle">查风险</text>
  <path class="arrow" d="M477 310 L473 366" />
  <rect class="rose" x="375" y="366" width="190" height="86" rx="12" />
  <text class="text" x="470" y="404" text-anchor="middle">测试 Agent</text>
  <text class="small" x="470" y="434" text-anchor="middle">验证结果</text>
  <path class="arrow" d="M595 302 L680 334" />
  <rect class="box" x="680" y="326" width="190" height="86" rx="12" />
  <text class="text" x="775" y="364" text-anchor="middle">记忆系统</text>
  <text class="small" x="775" y="394" text-anchor="middle">沉淀经验</text>
</svg>
