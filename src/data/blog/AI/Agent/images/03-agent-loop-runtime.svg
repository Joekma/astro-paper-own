<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Agent Loop 运行闭环</title>
  <desc id="desc">
    展示消息进入、上下文组装、模型推理、工具执行、持久化和回复的闭环。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 2;
      }
      .accent {
        fill: #dbeafe;
        stroke: #2563eb;
        stroke-width: 2;
      }
      .green {
        fill: #dcfce7;
        stroke: #16a34a;
        stroke-width: 2;
      }
      .yellow {
        fill: #fef9c3;
        stroke: #ca8a04;
        stroke-width: 2;
      }
      .purple {
        fill: #ede9fe;
        stroke: #7c3aed;
        stroke-width: 2;
      }
      .rose {
        fill: #ffe4e6;
        stroke: #e11d48;
        stroke-width: 2;
      }
      .soft {
        fill: #eef2ff;
        stroke: #818cf8;
        stroke-width: 2;
        stroke-dasharray: 8 8;
      }
      .tag {
        fill: #eff6ff;
        stroke: #60a5fa;
        stroke-width: 1.5;
      }
      .title {
        fill: #0f172a;
        font:
          700 26px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .subtitle {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .center {
        fill: #0f172a;
        font:
          700 21px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #1e293b;
        font:
          700 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          500 14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #2563eb;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .grid {
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56" text-anchor="start">
    Agent Loop 运行闭环
  </text>
  <text class="subtitle" x="48" y="84" text-anchor="start">
    展示消息进入、上下文组装、模型推理、工具执行、持久化和回复的闭环。
  </text>
  <rect class="accent" x="375" y="92" width="210" height="86" rx="12" />
  <text class="text" x="480" y="130" text-anchor="middle">消息进入</text>
  <text class="small" x="480" y="160" text-anchor="middle">通道标准化</text>
  <rect class="green" x="650" y="168" width="210" height="86" rx="12" />
  <text class="text" x="755" y="206" text-anchor="middle">上下文组装</text>
  <text class="small" x="755" y="236" text-anchor="middle">规则与记忆</text>
  <rect class="yellow" x="650" y="318" width="210" height="86" rx="12" />
  <text class="text" x="755" y="356" text-anchor="middle">模型推理</text>
  <text class="small" x="755" y="386" text-anchor="middle">下一步决策</text>
  <rect class="purple" x="375" y="388" width="210" height="86" rx="12" />
  <text class="text" x="480" y="426" text-anchor="middle">工具执行</text>
  <text class="small" x="480" y="456" text-anchor="middle">外部动作</text>
  <rect class="rose" x="100" y="318" width="210" height="86" rx="12" />
  <text class="text" x="205" y="356" text-anchor="middle">状态持久化</text>
  <text class="small" x="205" y="386" text-anchor="middle">可恢复轨迹</text>
  <rect class="box" x="100" y="168" width="210" height="86" rx="12" />
  <text class="text" x="205" y="206" text-anchor="middle">流式回复</text>
  <text class="small" x="205" y="236" text-anchor="middle">结果返回</text>
  <path class="arrow" d="M573.5 160.84 L661.5 185.16" />
  <path class="arrow" d="M755 262 L755 310" />
  <path class="arrow" d="M661.5 384.8 L573.5 407.2" />
  <path class="arrow" d="M386.5 407.2 L298.5 384.8" />
  <path class="arrow" d="M205 310 L205 262" />
  <path class="arrow" d="M298.5 185.16 L386.5 160.84" />
  <circle class="soft" cx="480" cy="260" r="82" />
  <text class="center" x="480" y="252" text-anchor="middle">闭环</text>
  <text class="small" x="480" y="280" text-anchor="middle">反馈驱动迭代</text>
</svg>
