<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="520"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">OpenClaw 与 Hermes 设计模式对比</title>
  <desc id="desc">
    展示两个 Agent 系统在控制面、工具组织、工作区和记忆闭环上的共同模式。
  </desc>
  <defs>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 2;
      }
      .accent {
        fill: #dbeafe;
        stroke: #2563eb;
        stroke-width: 2;
      }
      .green {
        fill: #dcfce7;
        stroke: #16a34a;
        stroke-width: 2;
      }
      .yellow {
        fill: #fef9c3;
        stroke: #ca8a04;
        stroke-width: 2;
      }
      .purple {
        fill: #ede9fe;
        stroke: #7c3aed;
        stroke-width: 2;
      }
      .rose {
        fill: #ffe4e6;
        stroke: #e11d48;
        stroke-width: 2;
      }
      .soft {
        fill: #eef2ff;
        stroke: #818cf8;
        stroke-width: 2;
        stroke-dasharray: 8 8;
      }
      .tag {
        fill: #eff6ff;
        stroke: #60a5fa;
        stroke-width: 1.5;
      }
      .title {
        fill: #0f172a;
        font:
          700 26px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .subtitle {
        fill: #475569;
        font:
          14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .center {
        fill: #0f172a;
        font:
          700 21px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .text {
        fill: #1e293b;
        font:
          700 18px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .small {
        fill: #475569;
        font:
          500 14px "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      .arrow {
        stroke: #2563eb;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .grid {
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
    </style>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" />
  <text class="title" x="48" y="56" text-anchor="start">
    OpenClaw 与 Hermes 设计模式对比
  </text>
  <text class="subtitle" x="48" y="84" text-anchor="start">
    展示两个 Agent 系统在控制面、工具组织、工作区和记忆闭环上的共同模式。
  </text>
  <rect class="box" x="60" y="108" width="840" height="320" rx="14" />
  <rect class="accent" x="260" y="108" width="320" height="58" rx="14" />
  <rect class="green" x="580" y="108" width="320" height="58" rx="14" />
  <text class="center" x="420" y="145" text-anchor="middle">OpenClaw</text>
  <text class="center" x="740" y="145" text-anchor="middle">Hermes</text>
  <line class="grid" x1="60" y1="166" x2="900" y2="166" />
  <text class="text" x="160" y="206" text-anchor="middle">Gateway 控制面</text>
  <text class="small" x="420" y="206" text-anchor="middle">多通道入口</text>
  <text class="small" x="740" y="206" text-anchor="middle">多平台接入</text>
  <line class="grid" x1="60" y1="230" x2="900" y2="230" />
  <text class="text" x="160" y="270" text-anchor="middle">工具组织</text>
  <text class="small" x="420" y="270" text-anchor="middle">Hooks / Tools</text>
  <text class="small" x="740" y="270" text-anchor="middle">Toolsets</text>
  <line class="grid" x1="60" y1="294" x2="900" y2="294" />
  <text class="text" x="160" y="334" text-anchor="middle">上下文载体</text>
  <text class="small" x="420" y="334" text-anchor="middle">Workspace 文件</text>
  <text class="small" x="740" y="334" text-anchor="middle">Memory / User</text>
  <line class="grid" x1="60" y1="358" x2="900" y2="358" />
  <text class="text" x="160" y="398" text-anchor="middle">能力复用</text>
  <text class="small" x="420" y="398" text-anchor="middle">Skills 文件</text>
  <text class="small" x="740" y="398" text-anchor="middle">Skills 系统</text>
  <line class="grid" x1="260" y1="108" x2="260" y2="428" />
  <line class="grid" x1="580" y1="108" x2="580" y2="428" />
</svg>
