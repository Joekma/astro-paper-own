<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C78A8" />
    </marker>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #264A73; }
      .label { font-size: 27px; font-weight: 700; }
      .block { font-size: 28px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .map { fill: none; stroke: #4C78A8; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Deterministic correction layer: cover only the generated left-column mechanism area. -->
  <rect x="72" y="194" width="706" height="449" rx="8" fill="#FFFFFF" />

  <text class="text label" x="108" y="226">Request A</text>
  <text class="text label" x="108" y="467">Request B</text>
  <text x="510" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#267985">P1–P6 物理块池</text>

  <!-- Logical blocks -->
  <g fill="#F7FAFD" stroke="#2F66A2" stroke-width="3">
    <rect x="100" y="244" width="174" height="50" rx="12" />
    <rect x="100" y="310" width="174" height="50" rx="12" />
    <rect x="100" y="376" width="174" height="50" rx="12" />
    <rect x="100" y="485" width="174" height="50" rx="12" />
    <rect x="100" y="551" width="174" height="50" rx="12" />
  </g>
  <text class="text block" x="187" y="269">A1</text>
  <text class="text block" x="187" y="335">A2</text>
  <text class="text block" x="187" y="401">A3</text>
  <text class="text block" x="187" y="510">B1</text>
  <text class="text block" x="187" y="576">B2</text>

  <!-- Physical block pool, ordered by physical address. -->
  <g fill="#F5FBFC" stroke="#4E9FAD" stroke-width="3">
    <rect x="594" y="218" width="132" height="48" rx="10" />
    <rect x="594" y="280" width="132" height="48" rx="10" />
    <rect x="594" y="342" width="132" height="48" rx="10" fill="#F1F2F4" stroke="#8A9099" />
    <rect x="594" y="404" width="132" height="48" rx="10" />
    <rect x="594" y="466" width="132" height="48" rx="10" />
    <rect x="594" y="528" width="132" height="48" rx="10" />
  </g>
  <text class="block" x="660" y="242" fill="#267985" font-family="Arial, sans-serif">P1</text>
  <text class="block" x="660" y="304" fill="#267985" font-family="Arial, sans-serif">P2</text>
  <text class="block" x="660" y="366" fill="#60656D" font-family="Arial, sans-serif">P3</text>
  <text class="block" x="660" y="428" fill="#267985" font-family="Arial, sans-serif">P4</text>
  <text class="block" x="660" y="490" fill="#267985" font-family="Arial, sans-serif">P5</text>
  <text class="block" x="660" y="552" fill="#267985" font-family="Arial, sans-serif">P6</text>
  <text x="736" y="374" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#60656D">Free</text>

  <!-- Exact mappings: A1→P2, A2→P5, A3→P1, B1→P4, B2→P6. -->
  <path class="map" d="M274 269 C390 269, 470 304, 590 304" />
  <path class="map" d="M274 335 C385 335, 470 490, 590 490" />
  <path class="map" d="M274 401 C390 401, 470 242, 590 242" />
  <path class="map" d="M274 510 C390 510, 470 428, 590 428" />
  <path class="map" d="M274 576 C390 576, 470 552, 590 552" />

  <!-- Small deterministic mapping legend removes any ambiguity at crossings. -->
  <text x="315" y="618" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#4D5663">A1→P2 · A2→P5 · A3→P1 · B1→P4 · B2→P6</text>
</svg>
